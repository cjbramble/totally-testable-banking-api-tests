repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run --frozen ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format check
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]

      - id: mypy
        name: Mypy
        entry: uv run --frozen mypy
        language: system
        pass_filenames: false
        always_run: true
        types: [python]
