[project]
name = "totally-testable-banking-api-tests"
version = "0.1.0"
description = "Independent API automation for Totally Testable Banking"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pre-commit>=4,<5",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: isolated tests of the API automation repository's own code",
    "smoke: fast checks of essential service behavior",
    "invariant: checks of durable business invariants",
    "negative: checks of rejected or invalid requests",
    "contract: checks of the banking-service and simulated-processor contract",
    "concurrency: checks involving controlled concurrent actions",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["src"]
packages = ["totally_testable_banking_api_tests"]
plugins = ["pydantic.mypy"]
