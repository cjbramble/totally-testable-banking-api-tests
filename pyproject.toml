[project]
name = "totally-testable-banking-api-tests"
version = "0.1.0"
description = "Independent API automation for Totally Testable Banking"
requires-python = ">=3.13,<3.14"

dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "smoke: fast checks of essential service behavior",
    "invariant: checks of durable business invariants",
    "negative: checks of rejected or invalid requests",
    "contract: checks of published API contracts",
    "concurrency: checks involving controlled concurrent actions",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
